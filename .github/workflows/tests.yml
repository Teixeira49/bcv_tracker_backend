name: Tests

# Corre la suite de pytest en cada Pull Request (y en push a las ramas
# principales) para que ninguna regresión —del scraping frágil o de cualquier
# endpoint— entre sin ser detectada (issue #20).
on:
  pull_request:
    branches: [development, main]
  push:
    branches: [development, main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        # conftest.py fija las variables de entorno requeridas (DATABASE_URL y
        # las URLs de proveedores son placeholders; los tests mockean la red),
        # así que no hacen falta secrets para correr la suite.
        run: pytest -q
