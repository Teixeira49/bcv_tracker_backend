[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
# Añade la raíz del repo al sys.path para que `import api...` funcione sin
# importar cómo se invoque pytest (`pytest` a secas en CI, o `python -m pytest`
# en local, que añade el CWD por su cuenta). Sin esto, el `pytest` script no
# tiene la raíz en el path y la colección falla con ModuleNotFoundError: 'api'.
pythonpath = .
